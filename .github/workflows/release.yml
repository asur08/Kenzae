name: 📦 Release & Changelog

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Zip dist for release
        run: |
          cd dist
          zip -r ../kenzae-boutique-${{ github.ref_name }}.zip .
          cd ..

      - name: Validate catalog before release
        run: python3 tools/validate_catalog_data.py

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ github.ref_name }}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Get commit messages since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi
          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ github.ref_name }}',
              name: '🛍️ Kenzae Boutique ${{ github.ref_name }}',
              body: `## Kenzae Designer Boutique — Release ${{ github.ref_name }}

            ### 🌟 What's New
            ${{ steps.changelog.outputs.commits }}

            ---
            ### 📦 Assets
            Download the \`kenzae-boutique-${{ github.ref_name }}.zip\` below to self-host the production build.

            ### 🛒 Boutique
            Kenzae Designer Boutique · Mulanthuruthy, Ernakulam, Kerala`,
              draft: false,
              prerelease: false
            });
            console.log(`Release created: ${release.html_url}`);

      - name: Upload dist zip to release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const zipPath = `kenzae-boutique-${{ github.ref_name }}.zip`;
            const data = fs.readFileSync(zipPath);
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releases.data[0].id,
              name: zipPath,
              data: data
            });
