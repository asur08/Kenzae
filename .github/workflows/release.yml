name: 📦 Release & Changelog

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Zip dist for release
        run: |
          cd dist
          zip -r ../kenzae-boutique-${{ github.ref_name }}.zip .
          cd ..

      - name: Validate catalog before release
        run: python3 tools/validate_catalog_data.py

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ github.ref_name }}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Get commit messages since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi
          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        uses: actions/github-script@v7
        env:
          COMMITS: ${{ steps.changelog.outputs.commits }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const tagName = process.env.RELEASE_TAG;
            const commits = process.env.COMMITS || 'Initial release updates.';
            const bodyContent = [
              `## Kenzae Designer Boutique — Release ${tagName}`,
              '',
              '### 🌟 What\'s New',
              commits,
              '',
              '---',
              '### 📦 Assets',
              `Download the \`kenzae-boutique-${tagName}.zip\` below to self-host the production build.`,
              '',
              '### 🛒 Boutique',
              'Kenzae Designer Boutique · Mulanthuruthy, Ernakulam, Kerala'
            ].join('\n');

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `🛍️ Kenzae Boutique ${tagName}`,
              body: bodyContent,
              draft: false,
              prerelease: false
            });
            console.log(`Release created: ${release.html_url}`);
            core.setOutput('release_id', release.id);

      - name: Upload dist zip to release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const releaseId = Number('${{ steps.create_release.outputs.release_id }}');
            const zipPath = `kenzae-boutique-${process.env.RELEASE_TAG}.zip`;
            const data = fs.readFileSync(zipPath);

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: zipPath,
              data: data,
              headers: {
                'content-type': 'application/zip',
                'content-length': data.length
              }
            });
            console.log(`Uploaded ${zipPath} to release ID ${releaseId}`);
