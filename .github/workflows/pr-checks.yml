name: 🛡️ PR Quality Gates

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and check bundle size
        env:
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID || 'rzp_test_U3fv7ch1nd3HLz' }}
        run: |
          npm run build
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find dist/assets -type f \( -name "*.js" -o -name "*.css" \) | sort | while read file; do
            size=$(du -sh "$file" | cut -f1)
            basename=$(basename "$file")
            echo "| \`$basename\` | $size |" >> $GITHUB_STEP_SUMMARY
          done
          total=$(du -sh dist/ | cut -f1)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total dist size:** $total" >> $GITHUB_STEP_SUMMARY

  catalog-pr-validate:
    name: Catalog Schema Integrity
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate catalog schema
        run: python3 tools/validate_catalog_data.py

      - name: Check catalog JSON is valid
        run: |
          python3 -c "import json; data=json.load(open('data/products.json')); print(f'✅ Catalog valid: {len(data)} products loaded')"

  accessibility-audit:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run accessibility audit
        run: python3 tools/audit_accessibility.py
        continue-on-error: true  # Informational — doesn't block merge

      - name: Summarize accessibility results
        run: echo "♿ Accessibility audit completed. Review output above for recommendations."

  label-pr:
    name: Auto-label PR
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Label PR by changed files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const labels = new Set();
            for (const file of files.data) {
              const path = file.filename;
              if (path.startsWith('src/components/staff/')) labels.add('staff-portal');
              if (path.startsWith('src/components/') && !path.includes('staff')) labels.add('ui');
              if (path.startsWith('data/')) labels.add('catalog-data');
              if (path.startsWith('tools/') || path.startsWith('scripts/')) labels.add('tooling');
              if (path.startsWith('.github/')) labels.add('ci-cd');
              if (path.endsWith('.md')) labels.add('documentation');
              if (path.startsWith('public/') || path === 'index.html') labels.add('assets');
            }
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: Array.from(labels)
              });
            }
